; =========================================================
; XIAOZHI SMART HOME AUTOMATION SYSTEM
; ESP32-S3 PROFESSIONAL BUILD CONFIG
; =========================================================

[platformio]
default_envs = esp32s3

; =========================================================
; ENVIRONMENT
; =========================================================

[env:esp32s3]

platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; =========================================================
; SERIAL
; =========================================================

monitor_speed = 115200
upload_speed = 921600

; =========================================================
; FLASH SETTINGS
; =========================================================

board_build.flash_mode = qio
board_build.flash_size = 16MB
board_build.partitions = huge_app.csv

; =========================================================
; FILE SYSTEM
; =========================================================

board_build.filesystem = littlefs

; =========================================================
; BUILD FLAGS
; =========================================================

build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_RUNNING_CORE=1
    -DARDUINO_EVENT_RUNNING_CORE=1

; =========================================================
; LIBRARIES
; =========================================================

lib_deps =

    ; =========================
    ; WEB SERVER
    ; =========================
    me-no-dev/ESP Async WebServer
    me-no-dev/AsyncTCP

    ; =========================
    ; JSON
    ; =========================
    bblanchon/ArduinoJson

    ; =========================
    ; DHT SENSOR
    ; =========================
    adafruit/DHT sensor library
    adafruit/Adafruit Unified Sensor

    ; =========================
    ; OLED DISPLAY
    ; =========================
    adafruit/Adafruit SSD1306
    adafruit/Adafruit GFX Library

    ; =========================
    ; RTC
    ; =========================
    adafruit/RTClib

    ; =========================
    ; BLYNK
    ; =========================
    blynkkk/Blynk

    ; =========================
    ; OTA
    ; =========================
    ayushsharma82/AsyncElegantOTA

    ; =========================
    ; DIMMER
    ; =========================
    RobotDynOfficial/RBDdimmer

    ; =========================
    ; AUDIO / I2S
    ; =========================
    earlephilhower/ESP8266Audio

    ; =========================
    ; PREFERENCES / STORAGE
    ; =========================
    paulstoffregen/Time

; =========================================================
; FILESYSTEM UPLOAD
; =========================================================

extra_scripts =
    pre:extra_script.py

; =========================================================
; OPTIMIZATION
; =========================================================

build_type = release

; =========================================================
; MONITOR FILTERS
; =========================================================

monitor_filters =
    esp32_exception_decoder
    time
